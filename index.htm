<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فحص كامل بالعدسة - خنفساء وورقة وتربة - عالم ندى</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#FFFBEB;color:#2D2D2D;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border:3px solid #2D2D2D;border-radius:20px;box-shadow:6px 6px 0 #2D2D2D;margin:12px}
.badge{padding:6px 12px;border-radius:20px;border:2.5px solid #2D2D2D;font-size:12px;font-weight:800;box-shadow:3px 3px 0 #2D2D2D}
.badge.s{background:#FFD93D} .badge.h{background:#FF6B9D;color:#fff} .badge.l{background:#4D96FF;color:#fff}
.container{max-width:860px;margin:0 auto;padding:0 12px 12px;display:flex;flex-direction:column}
.card{background:#fff;border:3px solid #2D2D2D;border-radius:24px;padding:18px;box-shadow:8px 8px 0 #2D2D2D}
.btn{width:100%;height:56px;border:3px solid #2D2D2D;border-radius:18px;background:linear-gradient(135deg,#FFD93D,#FF8C42);font-weight:900;font-size:17px;cursor:pointer;box-shadow:6px 6px 0 #2D2D2D}
.progress-wrap{height:14px;background:#fff;border:3px solid #2D2D2D;border-radius:20px;overflow:hidden;margin:10px 0;box-shadow:3px 3px 0 #2D2D2D}
.progress-bar{height:100%;background:linear-gradient(90deg,#FFD93D,#FF8C42,#FF6B9D);width:0%;transition:width 0.5s}
.stage-tag{padding:6px 14px;border-radius:20px;background:#4D96FF;color:#fff;border:2.5px solid #2D2D2D;font-size:11px;font-weight:800;box-shadow:3px 3px 0 #2D2D2D;display:inline-flex;margin-bottom:10px}
.scene{position:relative;width:100%;height:480px;border-radius:20px;overflow:hidden;border:3.5px solid #2D2D2D;background:#fff;box-shadow:6px 6px 0 #2D2D2D;cursor:none}
.scene-inner{position:absolute;inset:0}
.lens{position:absolute;width:200px;height:200px;border-radius:50%;border:6px solid #FFD93D;background:#fff;box-shadow:0 0 0 4px #2D2D2D,0 0 0 10px rgba(255,217,61,0.25),0 12px 28px rgba(0,0,0,0.18);pointer-events:none;z-index:20;overflow:hidden;display:none}
.lens-handle{position:absolute;width:100px;height:24px;background:linear-gradient(180deg,#FF8C42,#E67A2E);border:3px solid #2D2D2D;border-left:none;border-radius:0 14px 14px 0;top:50%;left:100%;transform:translateY(-50%);box-shadow:4px 4px 0 #2D2D2D}
.lens-view{position:absolute;width:500px;height:500px;top:50%;left:50%;transform:translate(-50%,-50%) scale(2.8);transform-origin:center;pointer-events:none}
.hit{position:absolute;width:42px;height:42px;border-radius:50%;background:#6BCB77;border:3px solid #2D2D2D;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;box-shadow:3px 3px 0 #2D2D2D;transform:translate(-50%,-50%) scale(0);transition:transform 0.4s;z-index:5}
.hit.found{transform:translate(-50%,-50%) scale(1)}
.qbox{margin-top:12px;background:#FFFBEB;border:3px solid #2D2D2D;border-radius:18px;padding:14px;box-shadow:5px 5px 0 #2D2D2D}
.opt{width:100%;text-align:right;padding:12px 14px;border-radius:14px;border:2.5px solid #2D2D2D;background:#fff;font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:8px;display:flex;gap:10px;box-shadow:3px 3px 0 #2D2D2D}
.opt.c{background:#6BCB77;color:#fff}.opt.w{background:#FF6B9D;color:#fff}.opt.s{background:#FFD93D}
.exp{margin-top:10px;padding:12px;border-radius:12px;background:#fff;border:2.5px solid #2D2D2D;font-size:12px;display:none;box-shadow:3px 3px 0 #2D2D2D}
.exp.show{display:block}
.inst{font-size:12px;font-weight:800;margin:8px 0;padding:10px 12px;background:#fff;border:2.5px solid #2D2D2D;border-radius:14px;box-shadow:4px 4px 0 #2D2D2D;display:flex;gap:8px;align-items:center}
.screen{display:none;flex:1}.screen.active{display:flex;flex-direction:column}
.center{justify-content:center;align-items:center;text-align:center}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div style="font-weight:900">🔍 عالم <span style="background:#FFD93D;padding:2px 8px;border-radius:10px;border:2px solid #2D2D2D">ندى</span> - فحص كامل</div>
    <div style="display:flex;gap:7px">
      <div class="badge s" id="scoreBadge">⭐ 0</div>
      <div class="badge h" id="heartsBadge">❤️❤️❤️</div>
      <div class="badge l" id="levelBadge">مستوى 1</div>
    </div>
  </div>

  <div class="screen active center" id="introScreen">
    <div class="card" style="max-width:600px;width:100%">
      <div style="background:#4D96FF;color:#fff;padding:6px 14px;border-radius:20px;border:2px solid #2D2D2D;display:inline-block;box-shadow:3px 3px 0 #2D2D2D;margin-bottom:10px">✨ فحص كامل حقيقي تحت العدسة ✨</div>
      <h1 style="font-size:24px;font-weight:900">فحص كامل<br><span style="background:linear-gradient(135deg,#FFD93D,#FF8C42);padding:4px 14px;border-radius:14px;border:3px solid #2D2D2D;box-shadow:4px 4px 0 #2D2D2D;display:inline-block;margin-top:6px">بالعدسة المكبرة</span></h1>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0">
        <div style="background:#FFD93D;border:2.5px solid #2D2D2D;border-radius:16px;padding:12px;box-shadow:4px 4px 0 #2D2D2D"><div style="font-size:26px">🪲</div><div style="font-size:10px;font-weight:900">المرحلة 1<br>خنفساء الروث</div></div>
        <div style="background:#6BCB77;border:2.5px solid #2D2D2D;border-radius:16px;padding:12px;box-shadow:4px 4px 0 #2D2D2D"><div style="font-size:26px">🍃</div><div style="font-size:10px;font-weight:900;color:#fff">المرحلة 2<br>ورقة شجر</div></div>
        <div style="background:#A67C52;border:2.5px solid #2D2D2D;border-radius:16px;padding:12px;box-shadow:4px 4px 0 #2D2D2D"><div style="font-size:26px">🌍</div><div style="font-size:10px;font-weight:900;color:#fff">المرحلة 3<br>تربة</div></div>
      </div>
      <button class="btn" id="startBtn">ابدأ الفحص الكامل 🔬🚀</button>
    </div>
  </div>

  <div class="screen" id="playScreen">
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;margin-bottom:8px">
      <span id="qCounter">مهمة 1 من 15</span>
      <span id="foundCounter">🔍 0 / 2</span>
    </div>
    <div class="card" style="padding:14px">
      <div class="stage-tag" id="stageTag">👀 المرحلة 1</div>
      <div class="inst" id="instruction"></div>
      <div class="scene" id="scene">
        <div class="scene-inner" id="sceneInner"></div>
        <div class="lens" id="lens"><div class="lens-view" id="lensView"></div><div class="lens-handle"></div></div>
        <div id="targetsContainer"></div>
      </div>
      <div class="qbox hidden" id="qBox">
        <h3 id="qText"></h3>
        <div id="optionsContainer"></div>
        <div class="exp" id="explainBox"></div>
        <button class="btn hidden" id="nextBtn">التالي ➡️🎉</button>
      </div>
    </div>
  </div>

  <div class="screen center" id="transScreen">
    <div class="card" style="text-align:center;min-width:340px">
      <div style="font-size:48px" id="transIcon">🎉</div>
      <h2 id="transTitle"></h2>
      <p id="transDesc"></p>
    </div>
  </div>

  <div class="screen center" id="winScreen">
    <div class="card" style="text-align:center;max-width:520px;width:100%">
      <div style="width:80px;height:80px;margin:0 auto 10px;border-radius:22px;background:linear-gradient(135deg,#FFD93D,#FF8C42);border:3px solid #2D2D2D;display:flex;align-items:center;justify-content:center;font-size:38px">🏆</div>
      <h2>أنت عالمة مبدعة! 🔬✨</h2>
      <div style="margin:14px 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <div style="background:#FFD93D;border:2.5px solid #2D2D2D;border-radius:14px;padding:10px"><div id="finalScore">0</div></div>
        <div style="background:#6BCB77;border:2.5px solid #2D2D2D;border-radius:14px;padding:10px"><div id="finalCorrect">0/15</div></div>
        <div style="background:#4D96FF;border:2.5px solid #2D2D2D;border-radius:14px;padding:10px"><div id="finalPercent">0%</div></div>
      </div>
      <button class="btn" id="replayWin">🔄 إعادة الفحص</button>
    </div>
  </div>

  <div class="screen center" id="loseScreen">
    <div class="card" style="text-align:center;max-width:420px;width:100%">
      <div style="font-size:44px">🔬</div>
      <h2>العدسة تحتاج صبر!</h2>
      <p id="loseText"></p>
      <button class="btn" id="retryBtn">🔄 حاولي مرة أخرى</button>
    </div>
  </div>
</div>

<script>
// دوال الرسم التفصيلي - خنفساء، ورقة، تربة - موجودة كاملة في الملف المحمل

</body>
</html>
