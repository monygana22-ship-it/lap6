 أظهرت قرنين صغيرين - قرون الاستشعار تساعدها على الشم واللمس."},{stage:1,title:"اللون واللمعان",instruction:"\uD83D\uDD0D قربي العدسة جداً لتري لمعان ظهر الخنفساء",bg:"linear-gradient(135deg, #1a140a 0%, #2a2010 100%)",targets:[{x:50,y:50,label:"✨ لمعان"}],question:"لماذا يلمع ظهر خنفساء الروث؟",options:["لأنه مبلل بالماء فقط","لأن غطائها الخارجي صلب وأملس يعكس الضوء","لأنها مضيئة","لأنها مطلية"],correct:1,explanation:"الغلاف الخارجي الصلب (الكيتين) أملس فيعكس الضوء فيبدو لامعاً - حماية لجسمها."},{stage:1,title:"مكان المعيشة",instruction:"\uD83D\uDD0D ابحثي عن بقايا روث وتربة رطبة حول الخنفساء",bg:"radial-gradient(circle, #3b2d14 0%, #1a140a 100%)",targets:[{x:20,y:70,label:"\uD83D\uDCA9 روث"},{x:80,y:30,label:"\uD83C\uDF31 تربة رطبة"}],question:"أين تعيش خنفساء الروث حسب ما رأيتِ بالعدسة؟",options:["في الماء","في تربة أحواض الزهور وقرب روث الحيوانات","على الأشجار العالية","في السماء"],correct:1,explanation:"العدسة أظهرت التربة الرطبة والروث - موطنها حيث تجد غذاءها."},{stage:2,title:"المسطرة والقياس",instruction:"\uD83D\uDD0D استخدمي العدسة لتقدير حجم الخنفساء - ابحثي عن مسطرة صغيرة",bg:"linear-gradient(90deg, #1e1a0f 0%, #2e2614 100%)",targets:[{x:40,y:45,label:"\uD83D\uDCCF 2 سم"},{x:60,y:45,label:"\uD83D\uDCCF"}],question:"كم يبلغ طول خنفساء الروث تقريباً؟",options:["20 سم","1-2 سم - صغيرة جداً تحتاج عدسة","10 سم","50 سم"],correct:1,explanation:"صغيرة جداً 1-2 سم لذلك نحتاج عدسة لرؤية تفاصيلها - المسطرة للقياس والعدسة للتكبير."},{stage:2,title:"بطاقة الملاحظة",instruction:"\uD83D\uDD0D ابحثي عن دفتر الملاحظات المخفي في المشهد",bg:"radial-gradient(circle, #222 0%, #111 100%)",targets:[{x:30,y:60,label:"\uD83D\uDCD3 دفتر"},{x:70,y:40,label:"✏️ قلم"}],question:"ماذا نكتب في بطاقة الملاحظة بعد استخدام العدسة؟",options:["اسمنا فقط","الاسم، المكان، اللون، الحجم، العدد، السلوك","لون السماء فقط","لا شيء"],correct:1,explanation:"بعد الملاحظة بالعدسة نسجل كل شيء: اسمها، أين وجدناها، لونها، حجمها، ماذا تفعل."},{stage:2,title:"مقارنة - خنفساء وعنكبوت",instruction:"\uD83D\uDD0D هناك خنفساء وعنكبوت مخفيان - جديهما وقارني عدد الأرجل",bg:"radial-gradient(circle at 30% 50%, #1a1a0f 0%, #0f0f0a 100%), radial-gradient(circle at 70% 50%, #1a0f0f 0%, #0f0a0a 100%)",targets:[{x:25,y:50,label:"\uD83E\uDEB2 6 أرجل"},{x:75,y:50,label:"\uD83D\uDD77️ 8 أرجل"}],question:"بعد المقارنة بالعدسة، ما الفرق بين الخنفساء والعنكبوت؟",options:["الاثنان لهما نفس عدد الأرجل","الخنفساء 6 أرجل (حشرة) والعنكبوت 8 أرجل (عنكبوتيات)","الخنفساء لها 8 والعنكبوت 6","لا فرق"],correct:1,explanation:"العدسة أوضحت الفرق الدقيق: 6 مقابل 8 أرجل - تصنيف علمي مهم."},{stage:2,title:"بيض الخنفساء",instruction:"\uD83D\uDD0D ابحثي عن بيض صغير أبيض مدفون في التربة قرب الخنفساء",bg:"radial-gradient(circle, #2a2010 0%, #14100a 100%)",targets:[{x:48,y:72,label:"\uD83E\uDD5A بيض"},{x:52,y:75,label:"\uD83E\uDD5A بيض"}],question:"ماذا وجدتِ بالعدسة في التربة بجانب الخنفساء؟",options:["لا شيء","بيض صغير أبيض - تضع الخنفساء بيضها في الروث","حجارة فقط","ماء فقط"],correct:1,explanation:"العدسة كشفت بيضاً صغيراً - الخنفساء تضع بيضها في كرة الروث ليكون غذاءً لصغارها."},{stage:2,title:"سلوك الدحرجة",instruction:"\uD83D\uDD0D تتبعي أثر دحرجة كرة الروث - ابحثي عن مسارها",bg:"linear-gradient(180deg, #2b2110 0%, #1a140a 100%)",targets:[{x:20,y:50,label:"\uD83D\uDD35 كرة روث"},{x:80,y:50,label:"\uD83D\uDD73️ جحر"}],question:"ماذا تفعل خنفساء الروث بكرة الروث التي تدحرجها؟",options:["تلعب بها","تدفعها إلى جحرها لتأكلها وتضع بيضها فيها","ترميها","تتركها"],correct:1,explanation:"سلوك مدهش رأيناه بالعدسة: تدحرج الكرة بعناية إلى جحرها - تخزين غذاء وحضانة."},{stage:3,title:"أثر في البيئة",instruction:"\uD83D\uDD0D ابحثي عن تربة مقلوبة ونظيفة بعد مرور الخنفساء",bg:"radial-gradient(circle, #3a2f1a 0%, #1e180a 100%)",targets:[{x:50,y:50,label:"♻️ تربة نظيفة"}],question:"ما فائدة خنفساء الروث للبيئة حسب ملاحظتك؟",options:["توسخ البيئة","تنظف البيئة من الروث وتقلب التربة وتجعلها خصبة","لا فائدة لها","تأكل النباتات"],correct:1,explanation:"بملاحظة التربة بعدها، نستنتج دورها: تنظيف الروث وتقليب التربة - مهمة للتوا
