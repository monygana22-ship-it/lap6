<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحقق بالعدسة - ألوان مبهجة - خنفساء حقيقية</title>
<style>
/* ألوان مبهجة للأطفال */
:root{--bg:#FFFBEB;--yellow:#FFD93D;--orange:#FF8C42;--green:#6BCB77;--blue:#4D96FF;--pink:#FF6B9D}
body{background:var(--bg);font-family:'Cairo',sans-serif}
.header{background:#fff;border:3px solid #2D2D2D;border-radius:20px;box-shadow:6px 6px 0 #2D2D2D}
.scene-wrap{border:3.5px solid #2D2D2D;border-radius:20px;background:#FDE68A;box-shadow:6px 6px 0 #2D2D2D;height:440px;position:relative;overflow:hidden;cursor:none}
.lens{position:absolute;width:170px;height:170px;border-radius:50%;border:6px solid #FFD93D;background:#fff;box-shadow:0 0 0 4px #2D2D2D,0 0 0 8px rgba(255,217,61,0.3);display:none;z-index:10;overflow:hidden}
.lens-handle{position:absolute;width:90px;height:22px;background:linear-gradient(#FF8C42,#E67A2E);border:3px solid #2D2D2D;border-radius:0 14px 14px 0;left:100%;top:50%;transform:translateY(-50%)}
/* باقي الكود في الملف المحمل يحتوي على الخنفساء المرسومة SVG والعدسة الحقيقية */
</style>
</head>
<body>
<!-- اللعبة كاملة في الملف المحمل -->
</body>
</html>
